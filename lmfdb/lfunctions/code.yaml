prompt:
  sage:   'sage'
  pari:   'gp'
  magma:  'magma'
  oscar:  'oscar'

frontmatter:
  all: |
    {lang} code for working with L-function {label}
  rest: |
    Note that the code below is using the arithmetic normalization.


# Here we give seperate code snippets for constructing  L-functions based on the origin of the L-function
# e.g. code for elliptic curves, genus 2 curves, modular forms, Dirichlet characters, etc...

lfunction_ec:
  comment: Define the L-function of the elliptic curve
  sage: |
    E = EllipticCurve({ainvs})
    L = E.lseries()
  pari: |
    E = ellinit({ainvs});
    L = lfuncreate(E);
  magma: |
    E := EllipticCurve({ainvs});
    L := LSeries(E);
  oscar: |
    E = elliptic_curve({ainvs})
    L = lseries(E)

lfunction_g2c:
  comment: Define the L-function of the genus 2 curve
  sage: |
    R = PolynomialRing(QQ, 'x')
    fh = {fh}
    C = HyperellipticCurve(R(fh[0]), R(fh[1]))
    from sage.lfunctions.pari import lfun_genus2, LFunction
    L = LFunction(lfun_genus2(C))
  pari: |
    fh = {fh};
    L = lfungenus2([Polrev(fh[1]), Polrev(fh[2])] );
  magma: |
    fh := {fh};
    L := LSeries(Genus2Curve(fh));
  oscar: |
    R, x = polynomial_ring(QQ, "x")
    fh = {fh}
    C = hyperelliptic_curve(R(fh[0]), R(fh[1]))
    L = lseries(C)

lfunction_dc:
  comment: Define the L-function of the Dirichlet character
  sage: |
    chi = DirichletCharacter({modulus}, {number})
    L = chi.lseries()
  pari: |
    chi = charinit({modulus}, {number});
    L = lfuncreate(chi);
  magma: |
    chi := DirichletCharacter({modulus}, {number});
    L := LSeries(chi);
  oscar: |
    test
    


# For each L-function invariant (degree, conductor, sign, etc.), we give a "generic" code snippet,
# and then give specific code snippets which depend on the origin of the L-function (which overrides the generic snippet)


# The conductor of the L-function
conductor:
  comment: Conductor
  pari: lfunparams(L)[1]
  magma: Conductor(L);
  sage: conductor(L)
  oscar: conductor(L)
conductor_ec:
  sage: E.conductor()
  pari: ellglobalred(E)[1]
  magma: Conductor(E);
  oscar: conductor(E)
conductor_g2c:
  sage: L.conductor
  pari: lfunparams(L)[1]
  magma: Conductor(L);
  oscar: conductor(L)
conductor_dc:
  sage: chi.conductor()
  pari: charconductor(chi)
  magma: Conductor(chi);
  oscar: conductor(chi)

# The imaginary parts of the zeros on the critial line
zeros:
  comment: Zeros on the critical line
  pari: lfunzeros(L, 20)
  sage: L.zeros(20)
  magma: Zeros(L, 20);
  oscar: zeros(L, 20)
zeros_ec:
  comment: Imaginary parts of the first 10 zeros on the critical line
  sage: L.zeros(10)
  pari: lfunzeros(L, 10)
  magma: Zeros(L, 10);
  oscar: zeros(L, 10)
zeros_g2c:
  sage: L.zeros(20)
  pari: lfunzeros(L, 20)
  magma: Zeros(L, 20);
  oscar: zeros(L, 20)
zeros_dc:
  sage: L.zeros(20)
  pari: lfunzeros(L, 20)
  magma: Zeros(L, 20);
  oscar: zeros(L, 20)


# Tests for L-function code snippets 
