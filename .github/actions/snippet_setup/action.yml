name: 'Snippet Setup'
description: 'Set up LMFDB environment for generating snippets'
    
runs:
  using: 'composite'
  steps:
  - uses: actions/checkout@v3

  - uses: conda-incubator/setup-miniconda@v2
    with:
      activate-environment: lmfdb
      auto-activate-base: false
      # environment-file: .environment.yml # now we install after cache
      channel-priority: strict
      # IMPORTANT: use-only-tar-bz2: true needs to be set for caching to work properly!
      use-only-tar-bz2: false

  - name: Cache conda
    uses: actions/cache@v3
    id: condacache
    env:
      # Increase this value to reset cache if .environment.yml has not changed
      CACHE_NUMBER: 0
    with:
      path: |
        /usr/share/miniconda/envs/lmfdb
      key:
        ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
        hashFiles('.environment.yml') }}

  - name: Install Julia
    uses: julia-actions/setup-julia@v2
    with:
      version: '1'          # latest version

  - name: Load Julia packages from cache
    id: julia-cache
    uses: julia-actions/cache@v2      

  - name: Install Oscar
    shell: bash -l {0}
    run: |
      julia -e 'using Pkg; Pkg.add("Oscar"); using Oscar'

  - name: Run install script
    shell: bash -l {0}
    # Only need to run install when deps has been changed
    if: steps.condacache.outputs.cache-hit != 'true'
    run: conda env create -f .environment.yml  || conda env update -f .environment.yml

  - name: Show conda info
    shell: bash -l {0}
    run: |
      conda info
      conda list

  - name: Cache pip
    uses: actions/cache@v3
    with:
      # This path is specific to Ubuntu
      path: ~/.cache/pip
      # Look to see if there is a cache hit for the corresponding requirements file
      key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      restore-keys: |
        ${{ runner.os }}-pip-
        ${{ runner.os }}-

  - name: pip stuff
    shell: bash -l {0}
    run: |
      sage -pip install -r requirements.txt


  # Some code snippets need optional CAS packages or database files which are not part of a default install;
  # See https://github.com/LMFDB/lmfdb/issues/7108.
 
  - name: Locate Sage's GAP package directory
    id: gap
    shell: bash -l {0}
    run: |
      transgrp=$(sage -gap -b -q -T -r -A \
        -c 'Print("TRANSGRP:", GAPInfo.PackagesInfo.transgrp[1].InstallationPath, "\n"); QUIT;' \
        | tr -d '\r' | sed -n 's/^TRANSGRP://p')
      test -d "$transgrp"
      echo "transgrp=$transgrp" >> "$GITHUB_OUTPUT"
      echo "pkgdir=$(dirname "$transgrp")" >> "$GITHUB_OUTPUT"
 
  - name: Install the GAP package hap
    shell: bash -l {0}
    # Needed for the Schur multiplier snippet G.homology(2) in groups/abstract/code.yaml
    run: |
      sage -gap -b -q -T -A -c 'LoadPackage("PackageManager");
        if InstallPackage("hap", false) <> true then ForceQuitGap(1); fi; QUIT;'
      # move it out of the user GAP root, which the snippet runner ignores (-r)
      find ~/.gap/pkg -mindepth 1 -maxdepth 1 \
        -exec mv -n {} "${{ steps.gap.outputs.pkgdir }}/" \; 2>/dev/null || true
      sage -gap -b -q -T -r -A -c 'Print("hap available: ", LoadPackage("hap"), "\n"); QUIT;'
 
  # The degree 32 transitive groups are a ~300MB download unpacking to ~1.3GB, so
  # they are cached separately rather than inside the (already large) conda cache.
  - name: Cache the degree 32 transitive groups
    uses: actions/cache@v3
    env:
      # Increase this value to force a re-download
      CACHE_NUMBER: 0
    with:
      path: ~/.cache/transgrp
      key: ${{ runner.os }}-trans32-${{ env.CACHE_NUMBER }}
 
  - name: Install the degree 32 transitive groups
    shell: bash -l {0}
    run: |
      if [ ! -d ~/.cache/transgrp/dat32 ]; then
        mkdir -p ~/.cache/transgrp /tmp/trans32
        curl -sSL https://www.math.colostate.edu/~hulpke/transgrp/trans32.tgz \
          | tar xz -C /tmp/trans32
        # the archive has been distributed both with and without a leading transgrp/
        mv "$(find /tmp/trans32 -type d -name dat32 | head -n1)" ~/.cache/transgrp/dat32
      fi
      ln -sfn ~/.cache/transgrp/dat32 "${{ steps.gap.outputs.transgrp }}/dat32"
      sage -c 'print("degree 32 available:", libgap.TransitiveGroupsAvailable(32))'
 
